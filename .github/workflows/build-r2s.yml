# ============================================================
#  NanoPi R2S FriendlyWrt + passwall + passwall2 — GitHub Actions 云编译
#  使用方法:
#    1. 将本项目推送到 GitHub 仓库 (Public 仓库免费)
#    2. 进入仓库 Actions 页面, 选择 "Build R2S Firmware"
#    3. 点击 "Run workflow" 手动触发
#    4. 编译完成后在 Artifacts 中下载固件
# ============================================================
name: Build R2S Firmware

on:
  workflow_dispatch:
    inputs:
      friendlywrt_branch:
        description: 'FriendlyWrt 分支'
        required: true
        default: 'master-v25.12'
        type: choice
        options:
          - master-v25.12
          - master-v22.03

env:
  WORKDIR: friendlywrt-rk3328

jobs:
  build:
    name: Compile R2S Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # === 准备阶段 ===
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "清理磁盘空间..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential subversion git g++ zlib1g-dev \
            libncurses5-dev gawk gettext unzip file libssl-dev \
            wget libelf-dev ecj fastjar python3 python3-distutils \
            python3-pyelftools python3-dev python3-venv python3-setuptools \
            curl rsync cpio xxd bison flex qemu-utils

      # === 下载源码 ===
      - name: Download FriendlyWrt source
        run: |
          mkdir -p ${{ env.WORKDIR }}
          cd ${{ env.WORKDIR }}

          git clone https://github.com/friendlyarm/repo --depth 1 tools

          tools/repo init -u https://github.com/friendlyarm/friendlywrt_manifests \
            -b ${{ inputs.friendlywrt_branch || 'master-v25.12' }} \
            -m rk3328.xml \
            --repo-url=https://github.com/friendlyarm/repo \
            --no-clone-bundle

          retry=0
          while ! tools/repo sync -c --no-clone-bundle -j4; do
            retry=$((retry + 1))
            echo "同步中断, 第 $retry 次重试..."
            sleep 5
            if [ $retry -gt 30 ]; then
              echo "::error::源码同步失败"
              exit 1
            fi
          done

          echo "源码下载完成"
          du -sh .

      # === 集成 passwall + passwall2 ===
      - name: Integrate passwall + passwall2
        run: |
          cd ${{ env.WORKDIR }}/friendlywrt

          # 直接克隆 passwall 包到 package 目录 (仓库已迁移到 Openwrt-Passwall 组织)
          # 不使用 feeds 方式, 避免与 build.sh 的 feeds install -a 产生重复包
          git clone --depth 1 -b main https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git clone --depth 1 -b main https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git clone --depth 1 -b main https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2-luci

          echo "passwall + passwall2 集成完成"
          ls -la package/passwall-*/Makefile package/passwall2-*/Makefile 2>/dev/null || true

      # === 安装自定义文件 (uci-defaults 脚本) ===
      - name: Install custom files (uci-defaults)
        run: |
          if [ -d files ]; then
            echo "安装自定义文件..."
            # 复制到 FriendlyWrt common-files
            mkdir -p ${{ env.WORKDIR }}/device/friendlyelec/rk3328/common-files
            cp -r files/* ${{ env.WORKDIR }}/device/friendlyelec/rk3328/common-files/ 2>/dev/null || true
            # 复制到 OpenWrt files/ (备用)
            mkdir -p ${{ env.WORKDIR }}/friendlywrt/files
            cp -r files/* ${{ env.WORKDIR }}/friendlywrt/files/ 2>/dev/null || true
            echo "已安装的自定义文件:"
            find files -type f -exec echo "  /{}" \;
          else
            echo "::warning::未找到 files/ 目录"
          fi

      # === 编译 uboot/kernel + 生成 .config ===
      - name: Build uboot/kernel + Generate config
        run: |
          cd ${{ env.WORKDIR }}

          # 1. 编译 uboot + kernel, 并生成默认 .config
          #    DEBUG_DOT_CONFIG=1 让 mk-friendlywrt.sh 在 "make defconfig" 后停止, 不编译 friendlywrt
          #    build_sdimg 会因 rootfs 不存在而失败, 用 || true 忽略
          echo "=== 编译 uboot + kernel + 生成 .config (DEBUG 模式) ==="
          DEBUG_DOT_CONFIG=1 ./build.sh rk3328.mk || true

          # 2. 检查 .config 是否生成
          if [ ! -f friendlywrt/.config ]; then
            echo "::error::.config 未生成, uboot/kernel 构建可能失败"
            ls -la configs/ 2>/dev/null || true
            ls -la configs/rockchip/ 2>/dev/null || true
            exit 1
          fi

          echo "=== .config 已生成 ==="
          wc -l friendlywrt/.config

      # === 精简 .config: 关闭非必要包, 保留 ddns/ttyd/passwall 完整 ===
      - name: Trim .config (disable non-essential packages, keep ddns/ttyd/full passwall)
        run: |
          cd ${{ env.WORKDIR }}/friendlywrt

          echo "=== 精简前 .config 包数量 ==="
          grep -c '=y' .config || true

          # 追加 passwall + passwall2 完整配置
          cat >> .config << 'PWCONF'

          # ===== Passwall + Passwall2 (完整编译) =====
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y

          # ===== 常用网络工具 =====
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_iptables-nft=y
          PWCONF

          # 第一次 defconfig: 让 passwall 依赖生效
          make defconfig

          # === 关闭非必要 LuCI 应用 (保留 ddns, ttyd, uhttpd) ===
          sed -i 's/^CONFIG_PACKAGE_luci-app-adblock=y/CONFIG_PACKAGE_luci-app-adblock=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-commands=y/CONFIG_PACKAGE_luci-app-commands=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-hd-idle=y/CONFIG_PACKAGE_luci-app-hd-idle=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-minidlna=y/CONFIG_PACKAGE_luci-app-minidlna=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-nlbwmon=y/CONFIG_PACKAGE_luci-app-nlbwmon=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-sqm=y/CONFIG_PACKAGE_luci-app-sqm=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-statistics=y/CONFIG_PACKAGE_luci-app-statistics=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-watchcat=y/CONFIG_PACKAGE_luci-app-watchcat=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-package-manager=y/CONFIG_PACKAGE_luci-app-package-manager=n/' .config

          # === 关闭重量级服务包 (非代理类, 纯粹节省编译时间) ===
          sed -i 's/^CONFIG_PACKAGE_samba4=y/CONFIG_PACKAGE_samba4=n/' .config
          sed -i 's/^CONFIG_PACKAGE_aria2=y/CONFIG_PACKAGE_aria2=n/' .config
          sed -i 's/^CONFIG_PACKAGE_bind=y/CONFIG_PACKAGE_bind=n/' .config
          sed -i 's/^CONFIG_PACKAGE_bind-libs=y/CONFIG_PACKAGE_bind-libs=n/' .config
          sed -i 's/^CONFIG_PACKAGE_minidlna=y/CONFIG_PACKAGE_minidlna=n/' .config
          sed -i 's/^CONFIG_PACKAGE_tcpdump=y/CONFIG_PACKAGE_tcpdump=n/' .config
          sed -i 's/^CONFIG_PACKAGE_tcpdump-mini=y/CONFIG_PACKAGE_tcpdump-mini=n/' .config

          # === 关闭 Docker (极其耗时) ===
          sed -i 's/^CONFIG_PACKAGE_dockerd=y/CONFIG_PACKAGE_dockerd=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-dockerman=y/CONFIG_PACKAGE_luci-app-dockerman=n/' .config
          sed -i 's/^CONFIG_PACKAGE_containerd=y/CONFIG_PACKAGE_containerd=n/' .config
          sed -i 's/^CONFIG_PACKAGE_docker=y/CONFIG_PACKAGE_docker=n/' .config

          # === 关闭其他不需要的包 (语言运行时, 不是代理) ===
          sed -i 's/^CONFIG_PACKAGE_nginx=y/CONFIG_PACKAGE_nginx=n/' .config
          sed -i 's/^CONFIG_PACKAGE_node=y/CONFIG_PACKAGE_node=n/' .config
          sed -i 's/^CONFIG_PACKAGE_node-npm=y/CONFIG_PACKAGE_node-npm=n/' .config
          sed -i 's/^CONFIG_PACKAGE_git=y/CONFIG_PACKAGE_git=n/' .config
          sed -i 's/^CONFIG_PACKAGE_git-http=y/CONFIG_PACKAGE_git-http=n/' .config
          sed -i 's/^CONFIG_PACKAGE_perl=y/CONFIG_PACKAGE_perl=n/' .config
          sed -i 's/^CONFIG_PACKAGE_python3=y/CONFIG_PACKAGE_python3=n/' .config
          sed -i 's/^CONFIG_PACKAGE_python3-pip=y/CONFIG_PACKAGE_python3-pip=n/' .config

          # 注意: 不关闭任何 passwall 组件 — 完整编译 sing-box, hysteria, tuic, naiveproxy,
          #       shadowsocks-rust, trojan-plus, shadow-tls, xray-core 等全部代理

          # 第二次 defconfig: 清理依赖关系
          make defconfig

          echo "=== 精简后 .config 包数量 ==="
          grep -c '=y' .config || true

          # 验证 passwall 仍然启用
          echo "=== 验证 passwall 配置 ==="
          grep -q 'CONFIG_PACKAGE_luci-app-passwall=y' .config && echo "passwall 已启用" || echo "::warning::passwall 未找到"
          grep -q 'CONFIG_PACKAGE_luci-app-passwall2=y' .config && echo "passwall2 已启用" || echo "::warning::passwall2 未找到"

          # 验证 ddns 和 ttyd 仍然启用
          echo "=== 验证 ddns/ttyd ==="
          grep 'CONFIG_PACKAGE_luci-app-ddns' .config || echo "::warning::ddns 配置未找到"
          grep 'CONFIG_PACKAGE_luci-app-ttyd' .config || echo "::warning::ttyd 配置未找到"

          # 显示已启用的 passwall 代理组件
          echo "=== 已启用的 passwall 代理组件 ==="
          grep -E 'CONFIG_PACKAGE_(xray-core|sing-box|hysteria|tuic-client|naiveproxy|shadowsocks-rust|shadowsocks-libev|trojan-plus|shadow-tls|chinadns-ng|dns2socks|ipt2socks|microsocks|geoview)' .config || true

          # 显示已启用的 LuCI 应用
          echo "=== 已启用的 LuCI 应用 ==="
          grep 'CONFIG_PACKAGE_luci-app-.*=y' .config || true

          # 删除官方 feeds 中与 passwall 冲突的包符号链接
          echo "=== 删除冲突包 ==="
          for pkg in xray-core v2ray-geodata sing-box chinadns-ng dns2socks hysteria \
              ipt2socks microsocks naiveproxy shadowsocks-libev shadowsocks-rust \
              shadowsocksr-libev simple-obfs tcping trojan-plus tuic-client \
              v2ray-plugin xray-plugin geoview shadow-tls; do
            rm -rf "package/feeds/packages/$pkg" 2>/dev/null || true
          done
          rm -rf package/feeds/packages/luci-app-passwall 2>/dev/null || true
          rm -rf package/feeds/packages/luci-app-passwall2 2>/dev/null || true
          rm -rf package/feeds/luci/luci-app-passwall 2>/dev/null || true
          rm -rf package/feeds/luci/luci-app-passwall2 2>/dev/null || true

          echo "配置精简完成"

      # === 缓存 dl/ 目录 (避免重复下载源码包) ===
      - name: Cache dl directory
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKDIR }}/friendlywrt/dl
          key: dl-r2s-${{ inputs.friendlywrt_branch || 'master-v25.12' }}-${{ hashFiles('.github/workflows/build-r2s.yml') }}
          restore-keys: |
            dl-r2s-${{ inputs.friendlywrt_branch || 'master-v25.12' }}-

      # === 缓存 Go 编译产物 (加速 Go/Rust 代理包编译) ===
      - name: Cache Go build directory
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/friendlywrt/tmp/go-build
            ${{ env.WORKDIR }}/friendlywrt/.go-cache
          key: go-cache-r2s-${{ inputs.friendlywrt_branch || 'master-v25.12' }}
          restore-keys: |
            go-cache-r2s-

      # === 编译 friendlywrt ===
      - name: Build FriendlyWrt
        env:
          GOCACHE: ${{ env.WORKDIR }}/friendlywrt/.go-cache
        run: |
          cd ${{ env.WORKDIR }}/friendlywrt

          echo "=== 下载源码包 ==="
          make download -j$(nproc) || true

          echo "=== 开始编译 (完整 passwall + ddns + ttyd) ==="
          echo "已启用包数: $(grep -c '=y' .config)"
          make -j$(nproc) || make -j1 V=sc

          echo "=== FriendlyWrt 编译完成 ==="

      # === 生成 SD 卡镜像 ===
      - name: Generate SD image
        run: |
          cd ${{ env.WORKDIR }}
          echo "=== 生成 SD 卡镜像 ==="
          sudo ./build.sh sd-img
          echo "=== SD 卡镜像生成完成 ==="

      # === 上传固件 ===
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: r2s-friendlywrt-passwall
          path: |
            ${{ env.WORKDIR }}/out/*.img
            ${{ env.WORKDIR }}/out/*.img.gz
          retention-days: 30
          compression-level: 0

      - name: Show image info
        if: always()
        run: |
          echo "=== 镜像文件 ==="
          ls -lh ${{ env.WORKDIR }}/out/*.img* 2>/dev/null || echo "未找到镜像文件"
          echo ""
          echo "=== 磁盘使用 ==="
          df -h /
