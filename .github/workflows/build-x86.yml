# ============================================================
#  OpenWrt x86_64 + passwall + passwall2 — GitHub Actions 云编译
#  使用方法:
#    1. 进入仓库 Actions 页面, 选择 "Build x86 Firmware"
#    2. 点击 "Run workflow" 手动触发
#    3. 编译完成后在 Artifacts 中下载固件
#  产出:
#    - squashfs-combined.img.gz (推荐, 支持恢复出厂设置)
#    - ext4-combined.img.gz (可写分区, 适合自定义)
#  刷机方式:
#    - 物理机: 用 Rufus/balenaEtcher 写入 U盘
#    - 虚拟机: 直接作为磁盘镜像使用
# ============================================================
name: Build x86 Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt 分支'
        required: true
        default: 'openwrt-25.12'
        type: choice
        options:
          - openwrt-25.12
          - openwrt-24.10
          - openwrt-23.05
          - main

env:
  WORKDIR: openwrt-x86

jobs:
  build:
    name: Compile x86 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # === 准备阶段 ===
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "清理磁盘空间..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential subversion git g++ zlib1g-dev \
            libncurses5-dev gawk gettext unzip file libssl-dev \
            wget libelf-dev ecj fastjar python3 python3-distutils \
            python3-pyelftools python3-dev python3-venv python3-setuptools \
            curl rsync cpio xxd bison flex qemu-utils

      # === 下载源码 ===
      - name: Download OpenWrt source
        run: |
          git clone --depth 1 -b ${{ inputs.openwrt_branch || 'openwrt-25.12' }} \
            https://github.com/openwrt/openwrt.git ${{ env.WORKDIR }}

          cd ${{ env.WORKDIR }}
          echo "=== OpenWrt 源码下载完成 ==="
          git log --oneline -1
          du -sh .

      # === 更新 feeds ===
      - name: Update and install feeds
        run: |
          cd ${{ env.WORKDIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== Feeds 更新完成 ==="

      # === 集成 passwall + passwall2 ===
      - name: Integrate passwall + passwall2
        run: |
          cd ${{ env.WORKDIR }}

          # 直接克隆 passwall 包到 package 目录 (仓库已迁移到 Openwrt-Passwall 组织)
          git clone --depth 1 -b main https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git clone --depth 1 -b main https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git clone --depth 1 -b main https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2-luci

          echo "passwall + passwall2 集成完成"
          ls -la package/passwall-*/Makefile package/passwall2-*/Makefile 2>/dev/null || true

      # === 安装自定义文件 (uci-defaults 脚本) ===
      - name: Install custom files (uci-defaults)
        run: |
          if [ -d files ]; then
            echo "安装自定义文件..."
            mkdir -p ${{ env.WORKDIR }}/files
            cp -r files/* ${{ env.WORKDIR }}/files/
            # 确保 uci-defaults 脚本有执行权限
            chmod +x ${{ env.WORKDIR }}/files/etc/uci-defaults/* 2>/dev/null || true
            echo "已安装的自定义文件:"
            find files -type f -exec echo "  /{}" \;
            echo "uci-defaults 权限检查:"
            ls -la ${{ env.WORKDIR }}/files/etc/uci-defaults/ 2>/dev/null || true
          else
            echo "::warning::未找到 files/ 目录"
          fi

      # === 生成 .config ===
      - name: Generate .config
        run: |
          cd ${{ env.WORKDIR }}

          # === 启用内核 diag 模块 (sing-box 依赖 kmod-netlink-diag + kmod-inet-diag) ===
          # CONFIG_SOCK_DIAG 是前置依赖, 没有它 NETLINK_DIAG 和 INET_DIAG 会被静默丢弃
          echo "启用内核 diag 配置到 x86 内核配置..."
          find target/linux/x86/ -name "config-*" -type f | while read cfg; do
            echo "  处理: $cfg"
            # SOCK_DIAG 是 bool, 必须=y (前置依赖)
            grep -q "CONFIG_SOCK_DIAG" "$cfg" || echo "CONFIG_SOCK_DIAG=y" >> "$cfg"
            # NETLINK_DIAG 编译为模块 (=m), 供 kmod-netlink-diag 使用
            grep -q "CONFIG_NETLINK_DIAG" "$cfg" || echo "CONFIG_NETLINK_DIAG=m" >> "$cfg"
            # INET_DIAG 系列, 供 kmod-inet-diag 使用
            grep -q "CONFIG_INET_DIAG" "$cfg" || echo "CONFIG_INET_DIAG=m" >> "$cfg"
            grep -q "CONFIG_INET_TCP_DIAG" "$cfg" || echo "CONFIG_INET_TCP_DIAG=m" >> "$cfg"
            grep -q "CONFIG_INET_UDP_DIAG" "$cfg" || echo "CONFIG_INET_UDP_DIAG=m" >> "$cfg"
            grep -q "CONFIG_INET_RAW_DIAG" "$cfg" || echo "CONFIG_INET_RAW_DIAG=m" >> "$cfg"
          done

          # 第一次 defconfig: 生成默认 x86_64 配置
          make defconfig

          echo "=== 默认 .config 包数量 ==="
          grep -c '=y' .config || true

          # 追加 passwall + passwall2 + 必要包配置
          cat >> .config << 'PWCONF'

          # ===== Target: x86_64 generic =====
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # ===== 镜像格式 =====
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y

          # ===== Passwall + Passwall2 (完整编译) =====
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y

          # ===== 核心基础服务 (确保 LuCI Web 界面可用) =====
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_nftables=y

          # ===== 中文汉化包 (系统 + 防火墙 + 各 LuCI 应用) =====
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y

          # ===== x86 常用驱动 (虚拟机 + 物理机) =====
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-virtio-blk=y
          CONFIG_PACKAGE_kmod-virtio-balloon=y
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-8139too=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-hid=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          PWCONF

          # 第二次 defconfig: 让 passwall 依赖生效
          make defconfig

          # === 关闭非必要 LuCI 应用 (保留 ddns, ttyd, uhttpd) ===
          sed -i 's/^CONFIG_PACKAGE_luci-app-adblock=y/CONFIG_PACKAGE_luci-app-adblock=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-commands=y/CONFIG_PACKAGE_luci-app-commands=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-hd-idle=y/CONFIG_PACKAGE_luci-app-hd-idle=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-minidlna=y/CONFIG_PACKAGE_luci-app-minidlna=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-nlbwmon=y/CONFIG_PACKAGE_luci-app-nlbwmon=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-sqm=y/CONFIG_PACKAGE_luci-app-sqm=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-statistics=y/CONFIG_PACKAGE_luci-app-statistics=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-watchcat=y/CONFIG_PACKAGE_luci-app-watchcat=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-package-manager=y/CONFIG_PACKAGE_luci-app-package-manager=n/' .config

          # === 关闭重量级服务包 (非代理类, 纯粹节省编译时间) ===
          sed -i 's/^CONFIG_PACKAGE_samba4=y/CONFIG_PACKAGE_samba4=n/' .config
          sed -i 's/^CONFIG_PACKAGE_aria2=y/CONFIG_PACKAGE_aria2=n/' .config
          sed -i 's/^CONFIG_PACKAGE_bind=y/CONFIG_PACKAGE_bind=n/' .config
          sed -i 's/^CONFIG_PACKAGE_bind-libs=y/CONFIG_PACKAGE_bind-libs=n/' .config
          sed -i 's/^CONFIG_PACKAGE_minidlna=y/CONFIG_PACKAGE_minidlna=n/' .config
          sed -i 's/^CONFIG_PACKAGE_tcpdump=y/CONFIG_PACKAGE_tcpdump=n/' .config
          sed -i 's/^CONFIG_PACKAGE_tcpdump-mini=y/CONFIG_PACKAGE_tcpdump-mini=n/' .config

          # === 关闭 Docker (极其耗时) ===
          sed -i 's/^CONFIG_PACKAGE_dockerd=y/CONFIG_PACKAGE_dockerd=n/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-dockerman=y/CONFIG_PACKAGE_luci-app-dockerman=n/' .config
          sed -i 's/^CONFIG_PACKAGE_containerd=y/CONFIG_PACKAGE_containerd=n/' .config
          sed -i 's/^CONFIG_PACKAGE_docker=y/CONFIG_PACKAGE_docker=n/' .config

          # === 关闭其他不需要的包 (语言运行时) ===
          sed -i 's/^CONFIG_PACKAGE_node=y/CONFIG_PACKAGE_node=n/' .config
          sed -i 's/^CONFIG_PACKAGE_node-npm=y/CONFIG_PACKAGE_node-npm=n/' .config
          sed -i 's/^CONFIG_PACKAGE_git=y/CONFIG_PACKAGE_git=n/' .config
          sed -i 's/^CONFIG_PACKAGE_git-http=y/CONFIG_PACKAGE_git-http=n/' .config
          sed -i 's/^CONFIG_PACKAGE_perl=y/CONFIG_PACKAGE_perl=n/' .config

          # 注意: 不关闭任何 passwall 组件 — 完整编译 sing-box, hysteria, tuic, naiveproxy,
          #       shadowsocks-rust, trojan-plus, shadow-tls, xray-core 等全部代理

          # 第三次 defconfig: 清理依赖关系
          make defconfig

          echo "=== 最终 .config 包数量 ==="
          grep -c '=y' .config || true

          # 验证 passwall 仍然启用
          echo "=== 验证 passwall 配置 ==="
          grep -q 'CONFIG_PACKAGE_luci-app-passwall=y' .config && echo "passwall 已启用" || echo "::warning::passwall 未找到"
          grep -q 'CONFIG_PACKAGE_luci-app-passwall2=y' .config && echo "passwall2 已启用" || echo "::warning::passwall2 未找到"

          # 验证 ddns 和 ttyd 仍然启用
          echo "=== 验证 ddns/ttyd ==="
          grep 'CONFIG_PACKAGE_luci-app-ddns' .config || echo "::warning::ddns 配置未找到"
          grep 'CONFIG_PACKAGE_luci-app-ttyd' .config || echo "::warning::ttyd 配置未找到"

          # 验证 kmod-diag 包 (sing-box 依赖)
          echo "=== 验证 kmod-diag 包 ==="
          grep 'CONFIG_PACKAGE_kmod-netlink-diag' .config || echo "::warning::kmod-netlink-diag 未找到"
          grep 'CONFIG_PACKAGE_kmod-inet-diag' .config || echo "::warning::kmod-inet-diag 未找到"

          # 显示已启用的 passwall 代理组件
          echo "=== 已启用的 passwall 代理组件 ==="
          grep -E 'CONFIG_PACKAGE_(xray-core|sing-box|hysteria|tuic-client|naiveproxy|shadowsocks-rust|shadowsocks-libev|trojan-plus|shadow-tls|chinadns-ng|dns2socks|ipt2socks|microsocks|geoview)' .config || true

          # 显示已启用的 LuCI 应用
          echo "=== 已启用的 LuCI 应用 ==="
          grep 'CONFIG_PACKAGE_luci-app-.*=y' .config || true

          # 显示目标信息
          echo "=== 目标信息 ==="
          grep 'CONFIG_TARGET_x86' .config || true

          # 删除 feeds 中与 passwall 冲突的包符号链接
          echo "=== 删除冲突包 ==="
          for pkg in xray-core v2ray-geodata sing-box chinadns-ng dns2socks hysteria \
              ipt2socks microsocks naiveproxy shadowsocks-libev shadowsocks-rust \
              shadowsocksr-libev simple-obfs tcping trojan-plus tuic-client \
              v2ray-plugin xray-plugin geoview shadow-tls; do
            rm -rf "package/feeds/packages/$pkg" 2>/dev/null || true
          done
          rm -rf package/feeds/packages/luci-app-passwall 2>/dev/null || true
          rm -rf package/feeds/packages/luci-app-passwall2 2>/dev/null || true
          rm -rf package/feeds/luci/luci-app-passwall 2>/dev/null || true
          rm -rf package/feeds/luci/luci-app-passwall2 2>/dev/null || true

          # === 安全网: 如果 kmod-diag 仍未启用, patch sing-box 去掉该依赖 ===
          if ! grep -q 'CONFIG_PACKAGE_kmod-netlink-diag=y' .config; then
            echo "::warning::kmod-netlink-diag 仍未启用, patch sing-box Makefile 去掉 kmod 依赖"
            # 找到 sing-box 的 Makefile 并移除 kmod-inet-diag 和 kmod-netlink-diag 依赖
            find package/ -path "*/sing-box/Makefile" -exec sed -i 's/+kmod-inet-diag//g; s/+kmod-netlink-diag//g' {} \;
            # 重新生成配置
            make defconfig
          fi

          echo "配置生成完成"

      # === 缓存 dl/ 目录 (避免重复下载源码包) ===
      - name: Cache dl directory
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKDIR }}/dl
          key: dl-x86-${{ inputs.openwrt_branch || 'openwrt-25.12' }}-${{ hashFiles('.github/workflows/build-x86.yml') }}
          restore-keys: |
            dl-x86-${{ inputs.openwrt_branch || 'openwrt-25.12' }}-

      # === 缓存 Go 编译产物 (加速 Go/Rust 代理包编译) ===
      - name: Cache Go build directory
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/tmp/go-build
            ${{ env.WORKDIR }}/.go-cache
          key: go-cache-x86-${{ inputs.openwrt_branch || 'openwrt-25.12' }}
          restore-keys: |
            go-cache-x86-

      # === 编译 OpenWrt ===
      - name: Build OpenWrt
        env:
          GOCACHE: ${{ env.WORKDIR }}/.go-cache
        run: |
          cd ${{ env.WORKDIR }}

          echo "=== 下载源码包 ==="
          make download -j$(nproc) || true

          echo "=== 开始编译 (完整 passwall + ddns + ttyd) ==="
          echo "已启用包数: $(grep -c '=y' .config)"
          make -j$(nproc) || make -j1 V=sc

          echo "=== OpenWrt 编译完成 ==="

      # === 收集固件 ===
      - name: Collect firmware
        run: |
          cd ${{ env.WORKDIR }}
          echo "=== 固件文件 ==="
          ls -lh bin/targets/x86/64/*.img* 2>/dev/null || echo "未找到固件文件"
          echo ""
          echo "=== 所有产出 ==="
          find bin/targets/x86/64/ -type f -name "*.img*" -o -name "*.manifest" -o -name "*.bin" 2>/dev/null | head -20
          echo ""
          echo "=== 磁盘使用 ==="
          df -h /

      # === 上传固件 ===
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: x86-openwrt-passwall
          path: |
            ${{ env.WORKDIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.WORKDIR }}/bin/targets/x86/64/*.manifest
          retention-days: 30
          compression-level: 0

      - name: Show build info
        if: always()
        run: |
          echo "=== 构建结果 ==="
          ls -lh ${{ env.WORKDIR }}/bin/targets/x86/64/*.img* 2>/dev/null || echo "未找到镜像文件"
          echo ""
          echo "=== 磁盘使用 ==="
          df -h /
